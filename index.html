<!doctype html>
<html lang="en">

<title>The Red Button</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600&display=swap" rel="stylesheet">

*{box-sizing:inherit}

</style>
</head>

const rim=new T.DirectionalLight(0x5aa0ff,1.4);rim.position.set(-6,4,-7);scene.add(rim);

 fragmentShader:'uniform float t,rip,glow;uniform vec3 col;varying vec2 vU;void main(){float d=length(vU-.5)*2.;float r=t-rip;float ring=exp(-pow(d*6.-r*7.,2.)*2.2)*exp(-r*1.3)*step(0.,r);float a=exp(-d*d*9.)*glow*.45+ring*.55;gl_FragColor=linearToOutputTexel(vec4(col*a,a));}'}));

 new T.MeshStandardMaterial({color:0x353d41,metalness:.95,roughness:.8,roughnessMap:brushed,side:T.DoubleSide}));

 vertexShader:'attribute float a,s;attribute vec3 c;varying float vA;varying vec3 vC;uniform float px;void main(){vA=a;vC=c;vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=s*px/-mv.z;gl_Position=projectionMatrix*mv;}',
 fragmentShader:'varying float vA;varying vec3 vC;void main(){float d=length(gl_PointCoord-.5)*2.;gl_FragColor=linearToOutputTexel(vec4(vC,smoothstep(1.,0.,d)*vA));}'}));

const DUST=[.72,.8,.78],SPARK=[1,.35,.2],WARM=[1,.82,.5];

const capS=new Spring(0,520,32),sq=new Spring(0,260,13),par={x:0,y:0,tx:0,ty:0},cb={};

let sayT;const sayEl=$('say');
return{
 onPress:f=>cb.press=f,onCaught:f=>cb.caught=f,

/* ============ 2. MEMORY ============ */
const KEY='redbutton:v2';
const Store={load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}},save(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}},wipe(){try{localStorage.removeItem(KEY)}catch(e){}}};
let saved=Store.load();
const M=saved?.M||{first:Date.now(),last:Date.now(),visits:0,total:0,counts:{}};
const S={tags:new Set(saved?.tags||[]),n:saved?.n||{knocks:0,doorPresses:0,mentionedDoor:0,nothingRun:0,sinceBig:99},hist:saved?.hist||[],since:saved?.since||{}};
const persist=()=>{M.last=Date.now();Store.save({M,tags:[...S.tags],n:S.n,hist:S.hist,since:S.since})};

/* ============ 3. PERSONALITY ============ */
function mood(){
  const hrsAway=(Date.now()-M.last)/3.6e6;
  const score={playful:.5+Object.keys(M.counts).length*.08,nervous:(S.tags.has('thing_below')?1.2:0)+(S.tags.has('suspicious')?.8:0),smug:M.total/50,lonely:hrsAway/10};
  return Object.entries(score).sort((a,b)=>b[1]-a[1])[0][0];
}
const LINES={
  nothing:{playful:['…','Nothing. Really.'],nervous:['Did you hear that? No. Nothing.'],smug:['Not everything is for you.'],lonely:['Still here.']},
  suspicious:{playful:['Nothing again. Suspicious?'],nervous:['Nothing. That is worse.'],smug:['You keep checking. Cute.'],lonely:['Nothing. Stay anyway.']},
  flee:{playful:['Catch me!'],nervous:['Nope nope nope.'],smug:['Try and keep up.'],lonely:['Come find me?']},
  caught:{playful:['Fine. You win.'],nervous:['Okay. Okay. Okay.'],smug:['Lucky.'],lonely:['You came after me.']},
  gravity:{playful:['Whee.'],nervous:['That wasn’t me.'],smug:['Look up. Or down.'],lonely:['Everything left, even the floor.']},
  gravityBack:{playful:['Back to normal. Mostly.'],nervous:['Better. Slightly.'],smug:['Boring, but fine.'],lonely:['Down again.']},
  pressback:{playful:[''],nervous:[''],smug:[''],lonely:['']},
  knock:{playful:['knock.'],nervous:['…knock.'],smug:['knock.'],lonely:['knock.']},
  door:{playful:['That wasn’t there before.'],nervous:['I did not build that.'],smug:['Go on, then.'],lonely:['It’s for you.']},
  doorHint:{playful:['Aren’t you curious about the door?'],nervous:['Please don’t open it. Or do.'],smug:['The door. You’re ignoring it.'],lonely:['You never look at the door.']},
  doorOpen:{playful:['That’s as far as this build goes.'],nervous:['Light. That’s all I know.'],smug:['See? Worth it.'],lonely:['It was waiting for you.']}
};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const talk=(k,ms)=>{const t=pick(LINES[k][mood()]);if(t)R.say(t,ms)};

/* ============ 4. CONSEQUENCES ============ */
const has=t=>S.tags.has(t);
const C=[
 {id:'nothing',fam:'quiet',w:2,cd:0,big:false,req:()=>true,play(){S.n.nothingRun++;if(S.n.nothingRun>=2){S.tags.add('suspicious');talk('suspicious')}else talk('nothing')}},
 {id:'flee',fam:'button',w:2,cd:6,big:true,req:()=>!has('button_fled'),play(){S.tags.add('button_fled');R.flee(3);talk('flee')}},
 {id:'gravity',fam:'world',w:2,cd:8,big:true,req:()=>true,play(){const f=!has('gravity_flipped');f?S.tags.add('gravity_flipped'):S.tags.delete('gravity_flipped');R.setFlip(f);talk(f?'gravity':'gravityBack')}},
 {id:'pressback',fam:'mystery',w:3,cd:30,big:true,req:()=>M.total>=15&&!has('thing_below'),play(){S.tags.add('thing_below');R.pushBack();R.say('',1)}},
 {id:'knock',fam:'mystery',w:4,cd:3,big:false,req:()=>has('thing_below')&&!has('door_present'),play(){S.n.knocks++;R.knock();talk('knock',1400)}},
 {id:'door',fam:'mystery',w:6,cd:5,big:true,req:()=>has('thing_below')&&!has('door_present')&&S.n.knocks>=3,play(){S.tags.add('door_present');R.door('show');talk('door',3200)}}
];
R.onCaught(()=>{S.tags.delete('button_fled');talk('caught');persist()});

/* ============ 5. ENGINE ============ */
function choose(){
  const pool=C.filter(c=>c.req()&&(S.since[c.id]===undefined||M.total-S.since[c.id]>=c.cd));
  const quietBias=S.n.sinceBig<2;
  const weighted=pool.map(c=>{let w=c.w/(1+(M.counts[c.id]||0)*.12);if(quietBias)w*=c.big?.15:3;if(c.id==='nothing')w+=Math.max(0,3-S.n.sinceBig)*.4;return[c,w]});
  let r=Math.random()*weighted.reduce((a,[,w])=>a+w,0);
  for(const[c,w]of weighted){if((r-=w)<=0)return c}
  return C[0];
}
function onPress(){
  M.total++;R.setMood(mood());
  if(has('door_present')&&!has('door_open')){
    S.n.doorPresses++;
    if(S.n.doorPresses===8&&!S.n.mentionedDoor){S.n.mentionedDoor=1;talk('doorHint',3200);persist();return}
    if(S.n.doorPresses>=20){S.tags.add('door_open');R.door('open');talk('doorOpen',4000);persist();return}
  }
  const c=choose();
  if(c.id!=='nothing')S.n.nothingRun=0;
  c.play();
  M.counts[c.id]=(M.counts[c.id]||0)+1;S.since[c.id]=M.total;
  S.n.sinceBig=c.big?0:S.n.sinceBig+1;
  S.hist=[...S.hist,c.id].slice(-20);
  persist();renderDebug();
}
R.onPress(onPress);

/* ============ 6. BOOT ============ */
R.setPresent(S);R.setMood(mood());
if(M.visits>0){
  const h=(Date.now()-M.last)/3.6e6,d=Math.floor(h/24);
  setTimeout(()=>R.say(h<1?'Back already.':d<1?'You came back.':d===1?'A day. You came back.':`${d} days. You came back.`,3600),900);
}else setTimeout(()=>R.say('Press it.',2400),900);
M.visits++;persist();
addEventListener('visibilitychange',persist);

/* ============ 7. DEBUG ============ */
function renderDebug(){
  R.debug(`<b>presses</b> ${M.total} · <b>mood</b> ${mood()}<br><b>tags</b> ${[...S.tags].join(', ')||'none'}<br><b>recent</b> ${S.hist.slice(-8).join(' → ')||'—'}<br><b>first press</b> ${new Date(M.first).toLocaleDateString()}<br><button id="reset">reset world</button>`);
  const b=document.getElementById('reset');if(b)b.onclick=()=>{Store.wipe();location.reload()};
}
document.getElementById('dbgBtn').onclick=()=>{document.getElementById('dbg').classList.toggle('on');renderDebug()};
</script>
</body>
</html>
