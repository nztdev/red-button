  if(has('door_open')&&room()==='stage'){talk('travel',2200);R.travel('sky',()=>{S.room='sky';persist();renderDebug()});return}
  if(has('door_present')&&!has('door_open')){
    S.n.doorPresses++;
    if(S.n.doorPresses===8&&!S.n.mentionedDoor){S.n.mentionedDoor=1;talk('doorHint',3200);persist();return}
    if(S.n.doorPresses>=20){S.tags.add('door_open');R.door('open');talk('doorOpen',4000);persist();return}
  }
  const c=choose();
  if(c.id!=='nothing')S.n.nothingRun=0;
  c.play();
  M.counts[c.id]=(M.counts[c.id]||0)+1;S.since[c.id]=M.total;
  S.n.sinceBig=c.big?0:S.n.sinceBig+1;
  S.hist=[...S.hist,c.id].slice(-20);
  persist();renderDebug();
}
R.onPress(onPress);

/* ============ 6. BOOT ============ */
R.setPresent(S);R.setMood(mood());
let _m='Press it.';if(M.visits>0){const h=(Date.now()-M.last)/3.6e6,d=Math.floor(h/24);_m=h<1?'Back already.':d<1?'You came back.':d===1?'A day. You came back.':`${d} days. You came back.`}
R.begin(M.visits===0,()=>R.say(_m,3200),S.room);
M.visits++;persist();
addEventListener('visibilitychange',persist);

/* ============ 7. DEBUG ============ */
function renderDebug(){
  R.debug(`<b>presses</b> ${M.total} · <b>mood</b> ${mood()} · <b>fps</b> ${R.fps()}<br><b>room</b> ${S.room} · <b>loc</b> ${M.loc?(M.loc.lat===null?'approx lon '+M.loc.lon:M.loc.lat+', '+M.loc.lon):'none'}<br><b>tags</b> ${[...S.tags].join(', ')||'none'}<br><b>recent</b> ${S.hist.slice(-8).join(' → ')||'—'}<br><b>first press</b> ${new Date(M.first).toLocaleDateString()}<br><button id="reset">reset world</button> <button id="jmp">jump: sky</button> <button id="clr">clear location</button>`);
  const b=document.getElementById('reset');if(b)b.onclick=()=>{Store.wipe();location.reload()};const j=document.getElementById('jmp');if(j)j.onclick=()=>{S.room='sky';persist();location.reload()};const cl=document.getElementById('clr');if(cl)cl.onclick=()=>{delete M.loc;M.asked=0;persist();renderDebug()};
}
document.getElementById('dbgBtn').onclick=()=>{document.getElementById('dbg').classList.toggle('on');renderDebug()};
</script>
</body>
